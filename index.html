  var b = store.get(key);
  if(!b) return;
  lastFocus = document.activeElement;
  state.open = key;
  syncUrl();

  var meta = C.STATUS_META[b.status] || C.STATUS_META.unknown;

  var proofs = b.claims.length
    ? h("div",{class:"proofs"}, b.claims.map(function(c){
        var box = h("div",{class:"proof" + (c.accepted ? " accepted" : "")});
        if(c.image){
          var im = h("img",{ alt: c.title ? ("Proof: " + c.title) : "Submitted proof",
                             loading:"lazy", decoding:"async", "data-gw":"0" });
          im.addEventListener("error", function(){
            var n = parseInt(im.getAttribute("data-gw")||"0",10)+1;
            var mm = /\/ipfs\/(.+)$/.exec(im.getAttribute("src")||"");
            if(mm && n < C.IPFS_GATEWAYS.length){
              im.setAttribute("data-gw", String(n));
              im.src = C.IPFS_GATEWAYS[n] + mm[1];
            }else{
              im.remove();
              box.insertBefore(h("div",{class:"pf", text:"Image could not be loaded from IPFS."}), box.firstChild);
            }
          });
          im.src = c.image;
          box.appendChild(im);
        }
        box.appendChild(h("div",{class:"pf"},[
          c.title ? h("div",{text:c.title}) : null,
          h("div",{class:"edge", text: c.claimant ? C.shortAddr(c.claimant) : "unknown claimant"})
        ]));
        return box;
      }))
    : h("div",{class:"note"},[
        h("b",{text:"No proof yet. "}),
        document.createTextNode("This frame is still unexposed — nobody has submitted a picture for it.")
      ]);

  var kv = h("dl",{class:"kv"},[
    h("dt",{text:"frame"}),    h("dd",{text:"#" + b.id + " on " + b.chainLabel}),
    h("dt",{text:"reward"}),   h("dd",{text:b.amountDisplay + " " + b.currency}),
    h("dt",{text:"state"}),    h("dd",{text:meta.label + " — " + meta.hint}),
    h("dt",{text:"posted by"}),h("dd",{text: b.issuer ? b.issuer : "unknown"}),
    h("dt",{text:"opened"}),   h("dd",{text: b.createdAt ? (new Date(b.createdAt).toISOString().slice(0,10) + " (" + C.relTime(b.createdAt) + ")") : "unknown"}),
    h("dt",{text:"proof"}),    h("dd",{text: b.claimCount + (b.claimCount === 1 ? " submission" : " submissions")})
  ]);

  var raw = h("details",{},[
    h("summary",{text:"Raw response for this bounty"}),
    h("div",{class:"raw"},[ h("pre",{text: safeJson(b.raw) }) ])
  ]);

  var inner = h("div",{class:"loupe-in"},[
    h("div",{class:"loupe-bar"},[
      h("span",{class:"edge", text:"Frame #" + b.id + " · " + b.chainLabel}),
      h("span",{class:"pill " + meta.tone, text:meta.label}),

        h("button",{class:"btn", type:"button", text:"Close", onclick:closeLoupe})
      ])

    h("div",{class:"loupe-body"},[
      h("h2",{id:"loupeTitle", text:b.title}),
      b.description ? h("p",{class:"desc", text:b.description}) : null,
      h("div",{class:"loupe-grid"},[

      ])
    ])
  ]);

  var lp = el("loupe");
  lp.replaceChildren(inner);
  lp.setAttribute("open","");
  document.body.style.overflow = "hidden";
  var btn = lp.querySelector(".btn");

function closeLoupe(){
  var lp = el("loupe");
  lp.removeAttribute("open");
  lp.replaceChildren();
  document.body.style.overflow = "";
  state.open = "";
  syncUrl();
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}

/** JSON.stringify that survives BigInt and cycles. */
function safeJson(v){
  var seen = new WeakSet();
  try{
    return JSON.stringify(v, function(k, val){
      if(typeof val === "bigint") return val.toString();
      if(val !== null && typeof val === "object"){
        if(seen.has(val)) return "[circular]";
        seen.add(val);
      }
      return val;
    }, 2);
  }catch(e){ return "Could not serialise this response."; }
}

function copyLink(btn){
  var url = location.href;
  var done = function(okFlag){
    if(!btn) return;
    var prev = btn.textContent;
    btn.textContent = okFlag ? "Link copied" : "Copy failed";
    setTimeout(function(){ btn.textContent = prev; }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ done(true); }, function(){ done(false); });
  }else{
    try{
      var ta = h("textarea",{}); ta.value = url;
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); done(true);
    }catch(e){ done(false); }
  }
}

/* ---------- notices ---------- */
function notice(kids){
  el("notices").appendChild(h("div",{class:"note"}, kids));
}

/* ---------- render orchestration ---------- */
var renderTimer = null;
function renderAll(){
  renderBar(); renderSheet(); renderLedger();
}
function scheduleRender(){
  if(renderTimer) return;
  renderTimer = setTimeout(function(){
    renderTimer = null;
    renderBar(); renderSheet(); renderRail();
  }, 700);
}
function progress(){
  var bar = el("loadbar");
  if(!bar) return;
  var pct = crawlTotal ? Math.min(100, Math.round(crawlDone / crawlTotal * 100)) : 0;
  bar.firstElementChild.style.width = pct + "%";
  if(!loading) bar.setAttribute("data-done","1");
}

/* ---------- crawl ---------- */
function crawlChain(chain, cacheIndex){
  var netFails = 0, netOk = 0;

  return C.discoverMaxId(function(id){ return existsBounty(chain, id); },
                         { max:200000, signal:abort.signal })
  .then(function(maxId){
    maxIds[chain] = maxId;
    if(!maxId){ diag(chain, "no bounties found", "bad"); return; }
    diag(chain, "highest bounty id " + maxId, "ok");

    var ids = [], lo = Math.max(1, maxId - SOFT_CAP + 1);
    for(var id = maxId; id >= lo; id--){
      if(fresh(cacheIndex[chain + ":" + id])) continue;
      ids.push(id);
    }
    var skipped = (maxId - lo + 1) - ids.length;
    if(skipped > 0) diag(chain, skipped + " served from cache", "ok");
    if(!ids.length) return;

    crawlTotal += ids.length;
    progress();

    return C.pool(ids, function(id){ return getBounty(chain, id); }, {
      concurrency: CONCURRENCY, retries: 3, backoffMs: 400, signal: abort.signal,
      onResult: function(r, id){
        netOk++; netFails = 0;
        crawlDone++;
        ingest(chain, id, r.raw);
        if(crawlDone % 15 === 0) flushWrites();
        progress(); scheduleRender();
      },
      onError: function(err, id){
        crawlDone++;
        progress();
        if(err && err.code === "not-found") return;         // a hole in the ids
        /* Everything else is a bounty that exists but could not be read, even
           after every retry. Record it so the shortfall can be reported
           instead of silently shrinking the sheet. */
        (unreadable[chain] = unreadable[chain] || []).push(id);
        if(err && (err.code === "network-or-cors" || err.code === "unparseable")){
          netFails++;
          if(netFails >= BREAKER && netOk === 0){
            sourceBroken = true;
            abort.abort();
            diag(chain, "stopped after " + netFails + " consecutive failures", "bad");
          }
        }
      }
    });
  })
  .catch(function(err){
    diag(chain, (err && err.message) || "failed", "bad");
    if(err && err.code === "network-or-cors") sourceBroken = true;
  });
}

/* Optional same-origin snapshot: lets the sheet fill even if poidh.xyz is
   unreachable. Ships absent; see README for how to generate one. */
function loadSnapshot(){
  return fetch("./snapshot.json", { cache:"no-cache" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j) return 0;
      var rows = Array.isArray(j) ? j : (j.bounties || []);
      var n = 0;
      for(var i=0;i<rows.length;i++){
        var row = rows[i];
        if(!row || !row.chain || row.id === undefined) continue;
        if(store.has(row.chain + ":" + row.id)) continue;
        if(ingest(row.chain, row.id, row.raw || row, row.fetchedAt)) n++;
      }
      if(n) diag("snapshot", n + " bounties loaded", "ok");
      return n;
    })
    .catch(function(){ return 0; });
}

/* ---------- boot ---------- */
/* Say so when the sheet is short. Bounties that exist but could not be read
   after every retry are invisible on a contact sheet — there is no gap to see —
   so without this the visitor would read a partial roll as the complete set.
   Naming the count and the chain is the difference between "here are the
   bounties" and "here are the bounties we could reach". */
function reportShortfall(){
  var parts = [], n = 0;
  for(var i=0;i<C.CHAIN_ORDER.length;i++){
    var ch = C.CHAIN_ORDER[i], lost = unreadable[ch];
    if(!lost || !lost.length) continue;
    n += lost.length;
    parts.push(lost.length + " on " + C.CHAINS[ch].label);
    diag(ch, lost.length + " bounties unreadable after retries", "warn");
  }
  if(!n) return;
  notice([
    h("b",{text:"Incomplete read. "}),
    document.createTextNode(parts.join(", ") + " could not be fetched after four attempts each, "
      + "so " + (n === 1 ? "it is" : "they are") + " missing from the sheet below. "
      + "Counts and totals reflect what was read, not what exists. Reload to try again.")
  ]);
}
/* One sentence naming where the frames on screen came from. Only used when the
   live read failed, which is exactly when a visitor deserves to know. The
   snapshot ships with the page, so "from cache" would wrongly imply a previous
   visit; the two sources are reported separately. */
function provenanceSentence(){
  if(!store.size) return "Nothing is cached and no snapshot is deployed, so the sheet is empty.";
  if(fromSnapshot && fromCache)
    return "The sheet below comes from the snapshot bundled with this page plus "
         + fromCache + " bounties cached on this device.";
  if(fromSnapshot)
    return "The sheet below comes from snapshot.json, archived alongside this page — "
         + "real bounty data, read at the time the snapshot was taken.";
  return "The sheet below is from the copy cached on this device by an earlier visit.";
}

function boot(){
  renderRail(); renderAll(); renderDiag();

  // 1. Paint whatever is cached, immediately.
  cache.all().then(function(rows){
    var cacheIndex = {};
    for(var i=0;i<rows.length;i++){
      var r = rows[i];
      if(!r || !r.key) continue;
      cacheIndex[r.key] = r;
      try{
        var b = C.normalizeBounty(r.raw, r.chain, r.id);
        store.set(b.key, b);
      }catch(e){}
    }
    if(rows.length) diag("cache", rows.length + " bounties restored", "ok");
    fromCache = store.size;
    pendingWrites.length = 0;   // restored rows are already persisted
    renderRail(); renderAll();
    if(state.open && store.has(state.open)) openLoupe(state.open);
    return cacheIndex;
  })
  // 2. Fill from the same-origin snapshot if one is deployed.
  .then(function(cacheIndex){
    return loadSnapshot().then(function(n){ fromSnapshot = n || 0; renderAll(); return cacheIndex; });
  })
  // 3. Go and read live data.
  .then(function(cacheIndex){
    loading = true;
    renderSubhead(0,0);
    var chains = C.CHAIN_ORDER.slice();
    var seq = Promise.resolve();
    chains.forEach(function(ch){
      seq = seq.then(function(){
        if(abort.signal.aborted) return;
        return crawlChain(ch, cacheIndex);
      });
    });
    return seq;
  })
  .then(function(){
    loading = false;
    flushWrites();
    progress();
    if(renderTimer){ clearTimeout(renderTimer); renderTimer = null; }
    renderRail(); renderAll();
    if(state.open && store.has(state.open) && !el("loupe").hasAttribute("open")) openLoupe(state.open);

    if(sourceBroken){
      notice([
        h("b",{text:"Live read failed. "}),
        document.createTextNode("Bounty data could not be fetched from poidh.xyz in this browser — usually a CORS restriction or an outage. "),
        document.createTextNode(provenanceSentence()),
        document.createTextNode(" Details are under Data sources, bottom right.")
      ]);
    }else if(!store.size){
      notice([
        h("b",{text:"No bounties came back. "}),
        document.createTextNode("The endpoint answered but returned nothing usable. Check Data sources, bottom right.")
      ]);
    }else{
      var total = 0, ks = Object.keys(maxIds);
      for(var i=0;i<ks.length;i++) total += maxIds[ks[i]];
      diag("done", store.size + " bounties on the sheet", "ok");
      reportShortfall();
    }
  });

  // interactions
  el("btnShare").addEventListener("click", function(e){ copyLink(e.target); });
  el("loupe").addEventListener("click", function(e){ if(e.target === el("loupe")) closeLoupe(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && el("loupe").hasAttribute("open")) closeLoupe();
  });
  window.addEventListener("hashchange", function(){
    var next = C.decodeState(location.hash.slice(1));
    state = next;
    showAll = false;
    renderRail(); renderAll();
    if(state.open && store.has(state.open)) openLoupe(state.open); else closeLoupe();
  });
  window.addEventListener("beforeunload", flushWrites);
}

/* ---------- Farcaster Mini App handshake ----------
   Best-effort, dependency-free. A Mini App host expects a "ready" signal so
   it can dismiss its splash screen; the official SDK sends it over a
   postMessage bridge. Loading that SDK from a CDN would add exactly the kind
   of external dependency this build avoids, so we post the signal directly on
   the three transports hosts are known to use. If the envelope is not what the
   current host expects the message is simply ignored, and the page still works
   as an ordinary web page — which is all the shared cast link needs.
   UNVERIFIED: no Farcaster host was available to test this against. */
function farcasterReady(){
  var msg = { type:"frame_ready", data:{} };
  var jsonrpc = { jsonrpc:"2.0", id:1, method:"ready", params:{} };
  try{ if(window.parent && window.parent !== window){
    window.parent.postMessage(msg, "*"); window.parent.postMessage(jsonrpc, "*");
  } }catch(e){}
  try{ if(window.ReactNativeWebView){
    window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  } }catch(e){}
  try{ if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.miniapp){
    window.webkit.messageHandlers.miniapp.postMessage(msg);
  } }catch(e){}
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", function(){ boot(); farcasterReady(); });
}else{ boot(); farcasterReady(); }

})();
</script>
</body>
